<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Destinations — Munees Travels Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" type="image/png" href="../images/munees-travels-logo.jpeg">

    <style>
        .dest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .dest-card {
            background: #fff;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            padding: 16px;
            transition: 0.25s;
            position: relative;
        }

        .dest-card:hover {
            border-color: #0EA5E9;
            box-shadow: 0 8px 24px rgba(14, 165, 233, 0.15);
            transform: translateY(-3px);
        }

        .dest-group-tag {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            background: #F0F9FF;
            color: #0369A1;
            margin-bottom: 10px;
        }

        .dest-card h4 {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 6px;
        }

        .dest-price {
            font-size: 20px;
            font-weight: 800;
            color: #16A34A;
            margin-bottom: 14px;
        }

        .dest-price small {
            font-size: 12px;
            color: #64748B;
            font-weight: 600;
        }

        .dest-actions {
            display: flex;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px solid #F1F5F9;
        }

        .dest-actions button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: inherit;
            transition: 0.22s;
        }

        .btn-edit {
            background: #F59E0B;
            color: #fff;
        }

        .btn-edit:hover {
            background: #D97706;
        }

        .btn-delete {
            background: #DC2626;
            color: #fff;
        }

        .btn-delete:hover {
            background: #B91C1C;
        }

        .status-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .status-active {
            background: #DCFCE7;
            color: #166534;
        }

        .status-inactive {
            background: #FEE2E2;
            color: #991B1B;
        }

        .add-btn {
            background: linear-gradient(135deg, #0EA5E9, #0284C7);
            color: #fff;
            padding: 12px 22px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            transition: 0.22s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(14, 165, 233, 0.45);
        }

        .search-bar {
            margin-top: 18px;
        }

        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 11px 16px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .search-bar input:focus {
            border-color: #0EA5E9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
        }

        /* Modal */
        .dest-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .dest-modal.open {
            display: flex;
        }

        .dest-modal-box {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .dest-modal-box h3 {
            font-size: 20px;
            color: #0F172A;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dest-modal-box h3 i {
            color: #0EA5E9;
        }

        .form-row {
            margin-bottom: 14px;
        }

        .form-row label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-row input,
        .form-row select {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .form-row input:focus,
        .form-row select:focus {
            border-color: #0EA5E9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .form-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            transition: 0.22s;
        }

        .btn-cancel {
            background: #F1F5F9;
            color: #64748B;
        }

        .btn-cancel:hover {
            background: #E2E8F0;
        }

        .btn-save {
            background: linear-gradient(135deg, #0EA5E9, #0284C7);
            color: #fff;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(14, 165, 233, 0.4);
        }
    </style>
</head>

<body>

    <div class="mobile-header">
        <div class="mobile-brand">
            <img src="../travel-logo-design.jpg" alt="Munees Travels" onerror="this.style.display='none'">
            <strong>Munees Admin</strong>
        </div>
        <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="admin-sidebar" id="adminSidebar">
        <button class="sidebar-close-btn" id="sidebarCloseBtn"><i class="fas fa-times"></i></button>
        <div class="sidebar-brand">
            <img src="../travel-logo-design.jpg" alt="Logo" class="sidebar-logo" onerror="this.style.display='none'">
            <div class="sidebar-brand-text">
                <strong>Munees Travels</strong>
                <span>Admin Panel</span>
            </div>
        </div>
        <div class="user-email" id="userEmail">Loading...</div>
        <nav class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-home"></i> <span>Dashboard</span></a>
            <a href="manage-services.html"><i class="fas fa-concierge-bell"></i> <span>Services</span></a>
            <a href="manage-gallery.html"><i class="fas fa-images"></i> <span>Gallery</span></a>
            <a href="manage-vehicles.html"><i class="fas fa-car"></i> <span>Vehicles</span></a>
            <a href="manage-destinations.html" class="active"><i class="fas fa-map-marked-alt"></i>
                <span>Destinations</span></a>
            <a href="manage-packages.html"><i class="fas fa-box"></i> <span>Packages</span></a>
            <a href="manage-testimonials.html"><i class="fas fa-quote-right"></i> <span>Testimonials</span></a>
            <a href="manage-bookings.html"><i class="fas fa-calendar-check"></i> <span>Bookings</span></a>
            <a href="manage-enquiries.html"><i class="fas fa-envelope"></i> <span>Enquiries</span></a>

            <a href="manage-vehicles.html"><i class="fas fa-car"></i> <span>Vehicles</span></a>
            <a href="manage-destinations.html"><i class="fas fa-map-marked-alt"></i> <span>Destinations</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="sidebar-visit-link"><i class="fas fa-globe"></i> <span>Visit
                    Website</span></a>
            <button class="sidebar-logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i>
                <span>Logout</span></button>
        </div>
    </aside>

    <main class="admin-main">
        <div class="admin-top-bar">
            <div>
                <h1><i class="fas fa-map-marked-alt"></i> Manage Destinations</h1>
                <p>Add, edit, and manage your travel destinations & pricing</p>
            </div>
            <button class="add-btn" onclick="openDestModal()">
                <i class="fas fa-plus"></i> Add Destination
            </button>
        </div>

        <div class="search-bar">
            <input type="text" id="searchDest" placeholder="🔍 Search destinations..." oninput="filterDestinations()">
        </div>

        <div class="dest-grid" id="destGrid">
            <div class="admin-empty"><i class="fas fa-spinner fa-spin"></i> Loading destinations...</div>
        </div>
    </main>

    <div class="dest-modal" id="destModal">
        <div class="dest-modal-box">
            <h3><i class="fas fa-map-marked-alt"></i> <span id="modalTitle">Add Destination</span></h3>
            <input type="hidden" id="destDocId">

            <div class="form-row">
                <label for="dName">Destination Name <span style="color:#DC2626;">*</span></label>
                <input type="text" id="dName" placeholder="e.g. Ooty" required>
            </div>

            <div class="form-row">
                <label for="dPrice">Base Price (₹) <span style="color:#DC2626;">*</span></label>
                <input type="number" id="dPrice" min="0" step="100" placeholder="5999" required>
            </div>

            <div class="form-row">
                <label for="dGroup">Category / Group <span style="color:#DC2626;">*</span></label>
                <input type="text" id="dGroup" placeholder="🏔️ Hill Stations" list="groupList" required>
                <datalist id="groupList">
                    <option value="🏔️ Hill Stations">
                    <option value="🏖️ Beaches">
                    <option value="🛕 Pilgrimage">
                    <option value="🏛️ Heritage & Culture">
                    <option value="🌍 International">
                </datalist>
            </div>

            <div class="form-row">
                <label for="dOrder">Display Order</label>
                <input type="number" id="dOrder" min="0" value="1">
            </div>

            <div class="form-row">
                <label for="dActive">Status</label>
                <select id="dActive">
                    <option value="true">✅ Active</option>
                    <option value="false">❌ Inactive</option>
                </select>
            </div>

            <div class="form-actions">
                <button class="btn-cancel" onclick="closeDestModal()"><i class="fas fa-times"></i> Cancel</button>
                <button class="btn-save" onclick="saveDestination()"><i class="fas fa-save"></i> Save
                    Destination</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>

    <script>
        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
        const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");
        const sidebarBackdrop = document.getElementById("sidebarBackdrop");
        const adminSidebar = document.getElementById("adminSidebar");

        function openSidebar() {
            adminSidebar?.classList.add("open");
            sidebarBackdrop?.classList.add("open");
            document.body.style.overflow = "hidden";
        }
        function closeSidebar() {
            adminSidebar?.classList.remove("open");
            sidebarBackdrop?.classList.remove("open");
            document.body.style.overflow = "";
        }
        mobileMenuBtn?.addEventListener("click", openSidebar);
        sidebarCloseBtn?.addEventListener("click", closeSidebar);
        sidebarBackdrop?.addEventListener("click", closeSidebar);

        let currentAdminEmail = "";
        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = "login.html"; return; }
            currentAdminEmail = user.email;
            document.getElementById("userEmail").textContent = user.email;
            loadDestinations();
        });

        function logout() {
            if (confirm("Logout?")) auth.signOut().then(() => window.location.href = "login.html");
        }
        window.logout = logout;

        let allDestinations = [];

        async function loadDestinations() {
            const grid = document.getElementById("destGrid");
            try {
                const snap = await db.collection("destinations").orderBy("group").get();
                allDestinations = [];
                snap.forEach(doc => allDestinations.push({ id: doc.id, ...doc.data() }));

                if (!allDestinations.length) {
                    grid.innerHTML = `<div class="admin-empty"><i class="fas fa-map-marked-alt"></i>No destinations yet. Click "Add Destination" to start.</div>`;
                    return;
                }
                renderDestinations(allDestinations);
            } catch (err) {
                grid.innerHTML = `<div class="admin-empty" style="color:#DC2626;">Error: ${err.message}</div>`;
            }
        }

        function renderDestinations(list) {
            const grid = document.getElementById("destGrid");
            if (!list.length) {
                grid.innerHTML = `<div class="admin-empty">No destinations match your search.</div>`;
                return;
            }
            grid.innerHTML = list.map(d => `
        <div class="dest-card">
          <span class="status-badge ${d.active !== false ? 'status-active' : 'status-inactive'}">
            ${d.active !== false ? 'Active' : 'Inactive'}
          </span>
          <span class="dest-group-tag">${d.group || 'Uncategorized'}</span>
          <h4>${d.name}</h4>
          <div class="dest-price">₹${(d.price || 0).toLocaleString('en-IN')} <small>starting</small></div>
          <div class="dest-actions">
            <button class="btn-edit" onclick="editDestination('${d.id}')"><i class="fas fa-edit"></i> Edit</button>
            <button class="btn-delete" onclick="deleteDestination('${d.id}')"><i class="fas fa-trash"></i> Delete</button>
          </div>
        </div>
      `).join('');
        }

        function filterDestinations() {
            const q = document.getElementById("searchDest").value.toLowerCase().trim();
            if (!q) { renderDestinations(allDestinations); return; }
            const filtered = allDestinations.filter(d =>
                (d.name || "").toLowerCase().includes(q) || (d.group || "").toLowerCase().includes(q)
            );
            renderDestinations(filtered);
        }

        function openDestModal() {
            document.getElementById("destDocId").value = "";
            document.getElementById("dName").value = "";
            document.getElementById("dPrice").value = "";
            document.getElementById("dGroup").value = "🏔️ Hill Stations";
            document.getElementById("dOrder").value = allDestinations.length + 1;
            document.getElementById("dActive").value = "true";
            document.getElementById("modalTitle").textContent = "Add Destination";
            document.getElementById("destModal").classList.add("open");
        }

        function editDestination(id) {
            const d = allDestinations.find(x => x.id === id);
            if (!d) return;
            document.getElementById("destDocId").value = id;
            document.getElementById("dName").value = d.name || "";
            document.getElementById("dPrice").value = d.price || "";
            document.getElementById("dGroup").value = d.group || "";
            document.getElementById("dOrder").value = d.order || 1;
            document.getElementById("dActive").value = (d.active !== false).toString();
            document.getElementById("modalTitle").textContent = "Edit Destination";
            document.getElementById("destModal").classList.add("open");
        }

        function closeDestModal() {
            document.getElementById("destModal").classList.remove("open");
        }

        async function saveDestination() {
            const docId = document.getElementById("destDocId").value;
            const name = document.getElementById("dName").value.trim();
            const price = parseFloat(document.getElementById("dPrice").value);
            const group = document.getElementById("dGroup").value.trim();
            const order = parseInt(document.getElementById("dOrder").value) || 1;
            const active = document.getElementById("dActive").value === "true";

            if (!name || isNaN(price) || !group) {
                alert("Please fill all required fields.");
                return;
            }

            const data = { name, price, group, order, active, updatedAt: new Date().toISOString() };

            try {
                if (docId) {
                    await db.collection("destinations").doc(docId).update(data);
                } else {
                    data.createdAt = new Date().toISOString();
                    await db.collection("destinations").add(data);
                }
                closeDestModal();
                loadDestinations();
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        async function deleteDestination(id) {
            if (!confirm("Delete this destination?")) return;
            try {
                await db.collection("destinations").doc(id).delete();
                loadDestinations();
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        window.openDestModal = openDestModal;
        window.editDestination = editDestination;
        window.closeDestModal = closeDestModal;
        window.saveDestination = saveDestination;
        window.deleteDestination = deleteDestination;
        window.filterDestinations = filterDestinations;
    </script>

</body>

</html>
