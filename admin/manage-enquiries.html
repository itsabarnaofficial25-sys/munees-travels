<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Enquiries — Munees Travels Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="../images/munees-travels-logo.jpeg">

</head>

<body>

  <!-- MOBILE HEADER -->
  <div class="mobile-header">
    <div class="mobile-brand">
      <img src="../images/munees-travels-logo-removebg-preview.png" alt="Munees Travels"
        onerror="this.style.display='none'">
      <strong>Munees Admin</strong>
    </div>
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
      <i class="fas fa-bars"></i>
    </button>
  </div>

  <!-- BACKDROP -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="adminSidebar">
    <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close">
      <i class="fas fa-times"></i>
    </button>

    <div class="sidebar-brand">
      <img src="../images/munees-travels-logo-removebg-preview.png" alt="Munees Travels Logo" class="sidebar-logo"
        onerror="this.style.display='none'">
      <div class="sidebar-brand-text">
        <strong>Munees Travels</strong>
        <span>Admin Panel</span>
      </div>
    </div>

    <div class="user-email" id="userEmail">Loading...</div>

    <nav class="sidebar-menu">
      <a href="dashboard.html"><i class="fas fa-home"></i> <span>Dashboard</span></a>
      <a href="manage-gallery.html"><i class="fas fa-images"></i> <span>Gallery</span></a>
      <a href="manage-vehicles.html"><i class="fas fa-car"></i> <span>Vehicles</span></a>
      <a href="manage-packages.html"><i class="fas fa-box"></i> <span>Packages</span></a>
      <a href="manage-testimonials.html"><i class="fas fa-quote-right"></i> <span>Testimonials</span></a>
      <a href="manage-bookings.html"><i class="fas fa-calendar-check"></i> <span>Bookings</span></a>
      <a href="manage-enquiries.html" class="active"><i class="fas fa-envelope"></i> <span>Enquiries</span></a> <a
        href="manage-settings.html"><i class="fas fa-envelope"></i> <span>Settings</span></a>

    </nav>

    <div class="sidebar-footer">
      <a href="../index.html" class="sidebar-visit-link">
        <i class="fas fa-globe"></i> <span>Visit Website</span>
      </a>
      <button class="sidebar-logout-btn" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="admin-main">
    <div class="admin-top-bar">
      <h1><i class="fas fa-envelope"></i> Enquiries (<span id="count">0</span>)</h1>
      <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div class="enq-list" id="enqList">
      <div class="admin-empty">
        <i class="fas fa-spinner fa-spin"></i> Loading...
      </div>
    </div>
  </main>

  <!-- ============ FIREBASE SDKs ============ -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <!-- ============ ALL-INLINE JS ============ -->
  <script>
    /* ============================================================
       1. MOBILE SIDEBAR TOGGLE
       ============================================================ */
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const sidebarCloseBtn = document.getElementById("sidebarCloseBtn");
    const sidebarBackdrop = document.getElementById("sidebarBackdrop");
    const adminSidebar = document.getElementById("adminSidebar");

    function openSidebar() {
      adminSidebar?.classList.add("open");
      sidebarBackdrop?.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeSidebar() {
      adminSidebar?.classList.remove("open");
      sidebarBackdrop?.classList.remove("open");
      document.body.style.overflow = "";
    }

    mobileMenuBtn?.addEventListener("click", openSidebar);
    sidebarCloseBtn?.addEventListener("click", closeSidebar);
    sidebarBackdrop?.addEventListener("click", closeSidebar);

    document.querySelectorAll(".admin-sidebar a").forEach(link => {
      link.addEventListener("click", () => {
        if (window.innerWidth <= 900) closeSidebar();
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSidebar();
    });

    window.addEventListener("resize", () => {
      if (window.innerWidth > 900) closeSidebar();
    });

    /* ============================================================
       2. AUTH GUARD + USER EMAIL
       ============================================================ */
    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      const emailEl = document.getElementById("userEmail");
      if (emailEl) emailEl.textContent = user.email;
      loadEnquiries(); // Load after auth
    });

    /* ============================================================
       3. LOGOUT
       ============================================================ */
    function logout() {
      if (confirm("Logout from admin panel?")) {
        auth.signOut()
          .then(() => window.location.href = "login.html")
          .catch(() => window.location.href = "login.html");
      }
    }
    window.logout = logout;

    /* ============================================================
       4. ENQUIRIES LOGIC
       ============================================================ */
    const list = document.getElementById("enqList");
    const countEl = document.getElementById("count");
    let allEnquiries = [];

    async function loadEnquiries() {
      try {
        const snap = await db.collection("enquiries").orderBy("createdAt", "desc").get();
        allEnquiries = [];
        snap.forEach(doc => allEnquiries.push({ id: doc.id, ...doc.data() }));
        countEl.textContent = allEnquiries.length;

        if (allEnquiries.length === 0) {
          list.innerHTML = `<div class="admin-empty"><i class="fas fa-inbox"></i>No enquiries yet</div>`;
          return;
        }

        list.innerHTML = "";
        allEnquiries.forEach(e => {
          const date = e.createdAt ? new Date(e.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
          const initial = (e.name || 'U').charAt(0).toUpperCase();
          list.innerHTML += `
            <div class="enq-card">
              <div class="enq-head">
                <div class="enq-avatar">${initial}</div>
                <div class="enq-date">${date}</div>
              </div>
              <h4>${e.name || 'Unknown'}</h4>
              <div class="enq-row"><i class="fas fa-envelope"></i> ${e.email || 'N/A'}</div>
              <div class="enq-row"><i class="fas fa-phone"></i> ${e.phone || 'N/A'}</div>
              ${e.city ? `<div class="enq-row"><i class="fas fa-map-pin"></i> ${e.city}</div>` : ''}
              ${e.destination ? `<div class="enq-row"><i class="fas fa-plane"></i> ${e.destination}</div>` : ''}
              ${e.vacationType ? `<div class="enq-row"><i class="fas fa-tag"></i> ${e.vacationType}</div>` : ''}
              <div class="enq-actions">
                <a class="admin-btn-icon view" href="mailto:${e.email}" style="flex:1;width:auto;height:auto;padding:9px;text-decoration:none;font-size:12px;font-weight:600;gap:6px;">
                  <i class="fas fa-reply"></i> Reply
                </a>
                <a class="admin-btn-icon whatsapp" href="https://wa.me/91${e.phone}" target="_blank" style="flex:1;width:auto;height:auto;padding:9px;text-decoration:none;font-size:12px;font-weight:600;gap:6px;">
                  <i class="fab fa-whatsapp"></i>
                </a>
                <button class="admin-btn-icon delete" onclick="del('${e.id}')" style="flex:1;width:auto;height:auto;padding:9px;gap:6px;font-size:12px;font-weight:600;">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>`;
        });
      } catch (err) {
        console.error(err);
        list.innerHTML = `<div class="admin-empty" style="color:#DC2626;"><i class="fas fa-exclamation-triangle"></i>Error: ${err.message}</div>`;
      }
    }

    async function del(id) {
      if (!confirm("Delete this enquiry?")) return;
      await db.collection("enquiries").doc(id).delete();
      loadEnquiries();
    }
    window.del = del;

    console.log("✅ Manage Enquiries inline JS loaded");
  </script>
</body>

</html>
